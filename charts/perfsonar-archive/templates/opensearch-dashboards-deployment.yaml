apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-opensearch-dashboards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      containers:
        - name: opensearch-dashboards
          image: {{ .Values.opensearchDashboards.image.repository }}:{{ .Values.opensearchDashboards.image.tag }}
          imagePullPolicy: {{ .Values.opensearchDashboards.image.pullPolicy }}
          env:
            - name: OPENSEARCH_HOSTS
              value: '["https://{{ include "perfsonar-archive.fullname" . }}-opensearch-node:9200"]'
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_BASEPATH
              value: {{ .Values.opensearchDashboards.basePath | quote }}
            - name: SERVER_REWRITEBASEPATH
              value: {{ ternary "true" "false" .Values.opensearchDashboards.rewriteBasePath | quote }}
          ports:
            - containerPort: 5601
          volumeMounts:
            - name: opensearch-shared
              mountPath: /usr/lib/perfsonar/archive/
      volumes:
        - name: opensearch-shared
          persistentVolumeClaim:
            claimName: {{ include "perfsonar-archive.fullname" . }}-opensearch-shared