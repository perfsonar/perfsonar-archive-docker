{{- if .Values.logstash.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-logstash
  labels:
    {{- include "perfsonar-archive.labels" . | nindent 4 }}
spec:
  type: {{ .Values.logstash.service.type }}
  selector:
    {{- include "perfsonar-archive.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: logstash
  ports:
    - name: api
      port: {{ .Values.logstash.service.port }}
      targetPort: api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-logstash
  labels:
    {{- include "perfsonar-archive.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.logstash.replicas }}

  selector:
    matchLabels:
      {{- include "perfsonar-archive.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: logstash

  template:
    metadata:
      labels:
        {{- include "perfsonar-archive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: logstash

    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - name: wait-for-logstash-files
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              until [ -f /usr/lib/perfsonar/logstash/.perfsonar-files-ready ]; do
                echo "Waiting for perfSONAR Logstash files..."
                sleep 5
              done

              echo "perfSONAR Logstash files are ready."
          volumeMounts:
            - name: perfsonar-logstash
              mountPath: /usr/lib/perfsonar/logstash

        - name: wait-for-logstash-sysconfig
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              echo "Waiting for perfSONAR-generated Logstash credentials..."

              until [ -s /usr/lib/perfsonar/logstash/sysconfig ] && \
                    grep -q '^export opensearch_output_user=' /usr/lib/perfsonar/logstash/sysconfig && \
                    grep -q '^export opensearch_output_password=' /usr/lib/perfsonar/logstash/sysconfig; do
                sleep 5
              done

              echo "Logstash sysconfig is ready."
          volumeMounts:
            - name: perfsonar-logstash
              mountPath: /usr/lib/perfsonar/logstash

        - name: configure-logstash-kubernetes
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              INPUT_FILE="/usr/lib/perfsonar/logstash/pipeline/01-inputs.conf"
              SYS_CONFIG="/usr/lib/perfsonar/logstash/sysconfig"

              test -f "${INPUT_FILE}"
              test -s "${SYS_CONFIG}"

              echo "Applying Kubernetes-specific Logstash configuration..."

              # Allow the Kubernetes Service/Ingress to reach the Logstash HTTP input.
              sed -i 's/host => "localhost"/host => "0.0.0.0"/g' "${INPUT_FILE}"

              # The perfSONAR archive entrypoint writes the Docker Compose hostname
              # opensearch-node to sysconfig. Replace it with this release's Service.
              sed -i \
                's|https://opensearch-node:9200|https://{{ include "perfsonar-archive.fullname" . }}-opensearch:9200|g' \
                "${SYS_CONFIG}"

              echo "Logstash Kubernetes configuration applied."
              grep 'host =>' "${INPUT_FILE}" || true
              grep '^export opensearch_output_host=' "${SYS_CONFIG}" || true
          volumeMounts:
            - name: perfsonar-logstash
              mountPath: /usr/lib/perfsonar/logstash

      containers:
        - name: logstash
          image: "{{ .Values.logstash.image.repository }}:{{ .Values.logstash.image.tag }}"
          imagePullPolicy: {{ .Values.logstash.image.pullPolicy }}

          env:
            {{- range $k, $v := .Values.logstash.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}

          ports:
            - name: api
              containerPort: 11283

          {{- with .Values.logstash.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: perfsonar-logstash
              mountPath: /usr/lib/perfsonar/logstash

      volumes:
        - name: perfsonar-logstash
          persistentVolumeClaim:
            claimName: {{ include "perfsonar-archive.fullname" . }}-logstash

      {{- with .Values.logstash.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.logstash.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.logstash.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
