{{- if .Values.opensearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-opensearch
  labels:
    {{- include "perfsonar-archive.labels" . | nindent 4 }}
spec:
  type: {{ .Values.opensearch.service.type }}
  selector:
    {{- include "perfsonar-archive.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
  ports:
    - name: https
      port: {{ .Values.opensearch.service.port }}
      targetPort: https
    - name: analyzer
      port: {{ default 9600 .Values.opensearch.service.performanceAnalyzerPort }}
      targetPort: analyzer

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-opensearch
  labels:
    {{- include "perfsonar-archive.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "perfsonar-archive.fullname" . }}-opensearch
  replicas: {{ .Values.opensearch.replicas }}

  selector:
    matchLabels:
      {{- include "perfsonar-archive.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: opensearch

  template:
    metadata:
      labels:
        {{- include "perfsonar-archive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: opensearch

    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        - name: fix-opensearch-data-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              echo "Current permissions:"
              ls -ld /usr/share/opensearch/data || true

              chown -R 1000:1000 /usr/share/opensearch/data
              chmod -R u+rwX,g+rwX /usr/share/opensearch/data

              echo "Updated permissions:"
              ls -ld /usr/share/opensearch/data
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data

        - name: downloader
          image: "{{ .Values.downloader.image.repository }}:{{ .Values.downloader.image.tag }}"
          imagePullPolicy: {{ .Values.downloader.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              echo "Copying perfSONAR files..."

              cp -a /usr/lib/perfsonar/archive/. /mnt/archive/
              cp -a /usr/lib/perfsonar/logstash/. /mnt/logstash/
              cp -a /usr/lib/perfsonar/dashboards/. /mnt/dashboards/

              test -f /mnt/archive/perfsonar-scripts/pselastic_secure_pre.sh

              touch /mnt/archive/.perfsonar-files-ready
              touch /mnt/logstash/.perfsonar-files-ready
              touch /mnt/dashboards/.perfsonar-files-ready

              echo "perfSONAR files copied successfully"
          volumeMounts:
            - name: perfsonar-archive
              mountPath: /mnt/archive

            - name: perfsonar-logstash
              mountPath: /mnt/logstash

            - name: perfsonar-dashboards
              mountPath: /mnt/dashboards

      containers:
        - name: opensearch
          image: "{{ .Values.opensearch.image.repository }}:{{ .Values.opensearch.image.tag }}"
          imagePullPolicy: {{ .Values.opensearch.image.pullPolicy }}

          # The perfSONAR entrypoint must initially run as root.
          # It later drops privileges before starting OpenSearch.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true

          env:
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-opensearch-admin" (include "perfsonar-archive.fullname" .)) .Values.opensearch.existingSecret }}
                  key: {{ default "OPENSEARCH_INITIAL_ADMIN_PASSWORD" .Values.opensearch.existingSecretKey }}

            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"

            - name: cluster.name
              value: opensearch-cluster

            - name: node.name
              value: opensearch-node

            - name: discovery.type
              value: single-node

            - name: bootstrap.memory_lock
              value: "true"

            - name: network.host
              value: "0.0.0.0"

          ports:
            - name: https
              containerPort: 9200

            - name: analyzer
              containerPort: 9600

          {{- with .Values.opensearch.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data

            - name: opensearch-config
              mountPath: /etc/perfsonar/opensearch

            - name: perfsonar-archive
              mountPath: /usr/lib/perfsonar/archive

            - name: perfsonar-logstash
              mountPath: /usr/lib/perfsonar/logstash

            - name: perfsonar-dashboards
              mountPath: /usr/lib/perfsonar/dashboards


      volumes:
        - name: perfsonar-archive
          persistentVolumeClaim:
            claimName: {{ include "perfsonar-archive.fullname" . }}-archive

        - name: perfsonar-logstash
          persistentVolumeClaim:
            claimName: {{ include "perfsonar-archive.fullname" . }}-logstash

        - name: perfsonar-dashboards
          persistentVolumeClaim:
            claimName: {{ include "perfsonar-archive.fullname" . }}-dashboards

        - name: opensearch-config
          persistentVolumeClaim:
            claimName: {{ include "perfsonar-archive.fullname" . }}-opensearch-config


        {{- if not .Values.opensearch.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}

      {{- with .Values.opensearch.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.opensearch.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.opensearch.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  {{- if .Values.opensearch.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "perfsonar-archive.labels" . | nindent 10 }}
          app.kubernetes.io/component: opensearch-data
      spec:
        accessModes:
          {{- toYaml .Values.opensearch.persistence.accessModes | nindent 10 }}

        {{- with .Values.opensearch.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}

        resources:
          requests:
            storage: {{ .Values.opensearch.persistence.size }}
  {{- end }}
{{- end }}
