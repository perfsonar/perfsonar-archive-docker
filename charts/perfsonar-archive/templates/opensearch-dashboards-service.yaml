apiVersion: v1
kind: Service
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-opensearch-dashboards
spec:
  selector:
    app: opensearch-dashboards
  ports:
    - port: {{ .Values.opensearchDashboards.service.port }}
      targetPort: 5601
  type: {{ .Values.opensearchDashboards.service.type }}