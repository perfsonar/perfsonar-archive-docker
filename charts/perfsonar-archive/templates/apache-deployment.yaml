{{- if .Values.apache.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: apache-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: generate-selfsigned-cert
          image: "{{ .Values.apache.initImage.repository }}:{{ .Values.apache.initImage.tag }}"
          imagePullPolicy: {{ .Values.apache.initImage.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache openssl
              mkdir -p /tls

              cat >/tmp/openssl.cnf <<'EOF'
              [req]
              distinguished_name = dn
              x509_extensions = v3_req
              prompt = no

              [dn]
              CN = localhost

              [v3_req]
              basicConstraints = CA:FALSE
              keyUsage = digitalSignature, keyEncipherment
              extendedKeyUsage = serverAuth
              subjectAltName = @alt_names

              [alt_names]
              DNS.1 = localhost
              EOF

              openssl req -x509 -nodes -newkey rsa:2048 \
                -keyout /tls/tls.key \
                -out /tls/tls.crt \
                -days {{ .Values.apache.tls.days }} \
                -config /tmp/openssl.cnf \
                -extensions v3_req

              chmod 600 /tls/tls.key
              chmod 644 /tls/tls.crt
          volumeMounts:
            - name: apache-tls
              mountPath: /tls

      containers:
        - name: apache
          image: "{{ .Values.apache.image.repository }}:{{ .Values.apache.image.tag }}"
          imagePullPolicy: {{ .Values.apache.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.apache.service.targetPort }}
          volumeMounts:
            - name: apache-config
              mountPath: /usr/local/apache2/conf/httpd.conf
              subPath: httpd.conf
            - name: apache-tls
              mountPath: /usr/local/apache2/conf/tls

      volumes:
        - name: apache-config
          configMap:
            name: {{ include "perfsonar-archive.fullname" . }}-apache-config
        - name: apache-tls
          emptyDir: {}
{{- end }}