{{- if .Values.apache.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: apache-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: generate-selfsigned-cert
          image: "{{ .Values.apache.initImage.repository }}:{{ .Values.apache.initImage.tag }}"
          imagePullPolicy: {{ .Values.apache.initImage.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache openssl
              mkdir -p /tls
              openssl req -x509 -nodes -newkey rsa:2048 \
                -keyout /tls/tls.key \
                -out /tls/tls.crt \
                -days {{ .Values.apache.tls.days }} \
                -subj '{{ .Values.apache.tls.subject }}'
              chmod 600 /tls/tls.key
              chmod 644 /tls/tls.crt
          volumeMounts:
            - name: apache-tls
              mountPath: /tls

      containers:
        - name: apache
          image: "{{ .Values.apache.image.repository }}:{{ .Values.apache.image.tag }}"
          imagePullPolicy: {{ .Values.apache.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.apache.service.targetPort }}
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: apache-config
              mountPath: /usr/local/apache2/conf/httpd.conf
              subPath: httpd.conf
            - name: apache-tls
              mountPath: /usr/local/apache2/conf/tls

      volumes:
        - name: apache-config
          configMap:
            name: {{ include "perfsonar-archive.fullname" . }}-apache-config
        - name: apache-tls
          emptyDir: {}
{{- end }}