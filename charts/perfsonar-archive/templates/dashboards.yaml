{{- if .Values.opensearchDashboards.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-dashboards
  labels:
    {{- include "perfsonar-archive.labels" . | nindent 4 }}
spec:
  type: {{ .Values.opensearchDashboards.service.type }}
  selector:
    {{- include "perfsonar-archive.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboards
  ports:
    - name: http
      port: {{ .Values.opensearchDashboards.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perfsonar-archive.fullname" . }}-dashboards
  labels:
    {{- include "perfsonar-archive.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.opensearchDashboards.replicas }}
  selector:
    matchLabels:
      {{- include "perfsonar-archive.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboards
  template:
    metadata:
      labels:
        {{- include "perfsonar-archive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboards
    spec:
      initContainers:
        - name: wait-for-opensearch
          image: curlimages/curl:8.15.0
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              until [ -f /usr/lib/perfsonar/dashboards/.perfsonar-files-ready ]; do
                echo "Waiting for perfSONAR dashboard files..."
                sleep 5
              done

              until curl -ksf \
                https://{{ include "perfsonar-archive.fullname" . }}-opensearch:9200/_cluster/health;
              do
                echo "Waiting for OpenSearch..."
                sleep 5
              done

          volumeMounts:
            - name: perfsonar-dashboards
              mountPath: /usr/lib/perfsonar/dashboards

      containers:
        - name: dashboards
          image: "{{ .Values.opensearchDashboards.image.repository }}:{{ .Values.opensearchDashboards.image.tag }}"
          imagePullPolicy: {{ .Values.opensearchDashboards.image.pullPolicy }}

          env:
            - name: OPENSEARCH_HOSTS
              value: '["https://{{ include "perfsonar-archive.fullname" . }}-opensearch:9200"]'
            - name: SERVER_HOST
              value: "0.0.0.0"

          ports:
            - name: http
              containerPort: 5601

          resources:
            {{- toYaml .Values.opensearchDashboards.resources | nindent 12 }}

          volumeMounts:
            - name: opensearch-config
              mountPath: /etc/perfsonar/opensearch

            - name: perfsonar-archive
              mountPath: /usr/lib/perfsonar/archive

            - name: perfsonar-dashboards
              mountPath: /usr/lib/perfsonar/dashboards

      volumes:
        - name: perfsonar-archive
          persistentVolumeClaim:
            claimName: {{ include "perfsonar-archive.fullname" . }}-archive

        - name: perfsonar-dashboards
          persistentVolumeClaim:
            claimName: {{ include "perfsonar-archive.fullname" . }}-dashboards

        - name: opensearch-config
          persistentVolumeClaim:
            claimName: {{ include "perfsonar-archive.fullname" . }}-opensearch-config

      {{- with .Values.opensearchDashboards.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.opensearchDashboards.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.opensearchDashboards.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
