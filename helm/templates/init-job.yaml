---
apiVersion: v1
data:
  pre_script: >-
     
kind: ConfigMap
metadata:
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded
  name: perfosnar-preinstall-script

---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
  labels:
    job-name: hello
  name: hello
spec:
  backoffLimit: 6
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  suspend: false
  template:
    spec:
      containers:
        - args:
            - /usr/local/bin/downloader.sh
          command:
            - /bin/bash
          image: debian:stable
          imagePullPolicy: IfNotPresent
          name: perfsonar-preinstall
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          volumeMounts:
            - mountPath: /usr/local/bin/downloader.sh
              name: perfosnar-preinstall-script
              subPath: pre_script   
            - mountPath: /usr/lib/perfsonar/logstash
              name: {{ .Release.Name }}-logstash-libs-pvc
            - mountPath: /usr/lib/perfsonar/archive
              name: {{ .Release.Name }}-archive-libs-pvc
            - mountPath: /usr/lib/perfsonar/dashboards
              name: {{ .Release.Name }}-dashboards-libs-pvc
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      volumes:
        - name: perfosnar-preinstall-script
          _type: configMap
          configMap:
            name: perfosnar-preinstall-script
        - name: {{ .Release.Name }}-archive-libs-pvc
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-archive-libs-pvc
        - name: {{ .Release.Name }}-dashboards-libs-pvc
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-dashboards-libs-pvc
        - name: {{ .Release.Name }}-logstash-libs-pvc
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-logstash-libs-pvc
