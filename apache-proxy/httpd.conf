
ServerName localhost

ProxyRequests Off
ProxyPreserveHost On

<Proxy "*">
    Require all granted
</Proxy>

# ----------------------------------------
# OpenSearch
# ----------------------------------------

SSLProxyEngine On

# Mirrors the original perfSONAR configuration.
# For production, consider configuring certificate
# verification instead of disabling it.
SSLProxyVerify None
SSLProxyCheckPeerCN Off
SSLProxyCheckPeerName Off
SSLProxyCheckPeerExpire Off

ProxyPass        /opensearch https://opensearch-node:9200 status=+I
ProxyPassReverse /opensearch https://opensearch-node:9200 status=+I

# ----------------------------------------
# OpenSearch Dashboards
# ----------------------------------------

ProxyPass        /opensearchdash http://opensearch-dashboards:5601 status=+I
ProxyPassReverse /opensearchdash http://opensearch-dashboards:5601 status=+I

# ----------------------------------------
# Logstash
# ----------------------------------------

ProxyPass        /logstash http://perfsonar-logstash:11283 status=+I
ProxyPassReverse /logstash http://perfsonar-logstash:11283 status=+I

<Location /logstash>
    AuthType Basic
    AuthName "Logstash Pass"
    AuthUserFile /etc/perfsonar/opensearch/logstash_login

    Require valid-user
</Location>

# ----------------------------------------
# Grafana
# ----------------------------------------

ProxyPass        /grafana http://perfsonar-grafana:3000 status=+I
ProxyPassReverse /grafana http://perfsonar-grafana:3000 status=+I

ProxyPass        /api http://perfsonar-grafana:3000/api status=+I
ProxyPassReverse /api http://perfsonar-grafana:3000/api status=+I